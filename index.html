<body>
<div class="wrap" style="max-width:480px">
  <header style="padding:36px 0 6px"><h1 class="lead" style="margin:0">축제 부스 줄서기</h1><p class="lead-sub" style="margin-top:6px">용도에 맞는 화면을 골라 주세요.</p></header>
  <div class="rows" style="grid-template-columns:1fr;margin-top:20px">
    <a class="row ok" href="visitor.html"><span class="r-top"><span class="r-name">방문자용</span><span class="chip ok">QR로 접속</span></span><span class="r-meta">부스 대기현황 보기, 줄서기, 호출 알림</span></a>

</div>
